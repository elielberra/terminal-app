name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      terminal-app: ${{ steps.filter.outputs.terminal-app }}
      rag-chain: ${{ steps.filter.outputs.rag-chain }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed modules
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            terminal-app:
              - 'terminal-app/**'
            rag-chain:
              - 'rag-chain/**'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: terminal-app
            context: ./terminal-app
            dockerfile: ./terminal-app/Dockerfile.prod
            image: elober/terminal-app
          - service: rag-chain
            context: ./rag-chain
            dockerfile: ./rag-chain/Dockerfile.prod
            image: elober/rag-chain
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        if: |
          github.event_name == 'workflow_dispatch' ||
          (matrix.service == 'terminal-app' && needs.changes.outputs.terminal-app == 'true') ||
          (matrix.service == 'rag-chain' && needs.changes.outputs.rag-chain == 'true')
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build-and-push.result != 'failure' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: admin
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/admin/terminal-app
            git pull --ff-only origin main
            bash prod-restart.sh
