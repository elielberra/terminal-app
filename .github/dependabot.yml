version: 2
updates:
  - package-ecosystem: gomod
    directory: /terminal-app
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /rag-chain
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /terminal-app
      - /rag-chain
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
